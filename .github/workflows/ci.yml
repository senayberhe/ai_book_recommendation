name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy langchain-core gradio python-dotenv
          pip install pytest ruff mypy pandas-stubs

      - name: Lint (ruff)
        run: ruff check book_recommender tests

      - name: Type check (mypy)
        run: mypy book_recommender

      - name: Run tests
        run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: book-recommender:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: [test, docker]
    # Only deploy pushes to main (never pull requests), one deploy at a time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-space
      cancel-in-progress: false
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: sunny20/semantic-book-recommender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to the Space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set - skipping deploy."
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.23"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              ignore_patterns=[".git/*", ".github/*"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub Actions",
          )
          print("Deployed to https://huggingface.co/spaces/" + os.environ["HF_SPACE"])
          PY
